<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Body -->
  <ellipse cx="100" cy="150" rx="55" ry="50" fill="#F4A460"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="45" fill="#F4A460"/>

  <!-- Left ear -->
  <polygon points="62,50 50,15 85,42" fill="#F4A460"/>
  <polygon points="65,47 55,22 80,44" fill="#FFB6C1"/>

  <!-- Right ear -->
  <polygon points="138,50 150,15 115,42" fill="#F4A460"/>
  <polygon points="135,47 145,22 120,44" fill="#FFB6C1"/>

  <!-- Face markings -->
  <ellipse cx="85" cy="95" rx="15" ry="12" fill="#fff"/>
  <ellipse cx="115" cy="95" rx="15" ry="12" fill="#fff"/>

  <!-- Eyes -->
  <ellipse cx="85" cy="93" rx="8" ry="9" fill="#2d2d2d"/>
  <ellipse cx="115" cy="93" rx="8" ry="9" fill="#2d2d2d"/>
  <circle cx="87" cy="90" r="2.5" fill="#fff"/>
  <circle cx="117" cy="90" r="2.5" fill="#fff"/>

  <!-- Nose -->
  <polygon points="100,103 96,108 104,108" fill="#FF8C94"/>

  <!-- Mouth -->
  <path d="M96,108 Q100,114 104,108" stroke="#2d2d2d" stroke-width="1.5" fill="none"/>

  <!-- Whiskers left -->
  <line x1="55" y1="105" x2="90" y2="107" stroke="#888" stroke-width="1.2"/>
  <line x1="52" y1="110" x2="90" y2="110" stroke="#888" stroke-width="1.2"/>
  <line x1="55" y1="115" x2="90" y2="113" stroke="#888" stroke-width="1.2"/>

  <!-- Whiskers right -->
  <line x1="145" y1="105" x2="110" y2="107" stroke="#888" stroke-width="1.2"/>
  <line x1="148" y1="110" x2="110" y2="110" stroke="#888" stroke-width="1.2"/>
  <line x1="145" y1="115" x2="110" y2="113" stroke="#888" stroke-width="1.2"/>

  <!-- Belly -->
  <ellipse cx="100" cy="158" rx="30" ry="28" fill="#FDD5A0"/>

  <!-- Left arm -->
  <ellipse cx="52" cy="148" rx="14" ry="10" fill="#F4A460" transform="rotate(-30, 52, 148)"/>

  <!-- Right arm -->
  <ellipse cx="148" cy="148" rx="14" ry="10" fill="#F4A460" transform="rotate(30, 148, 148)"/>

  <!-- Left leg -->
  <ellipse cx="78" cy="195" rx="16" ry="12" fill="#F4A460"/>

  <!-- Right leg -->
  <ellipse cx="122" cy="195" rx="16" ry="12" fill="#F4A460"/>

  <!-- Tail -->
  <path d="M155,170 Q185,145 175,120 Q165,100 180,88" stroke="#F4A460" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M155,170 Q185,145 175,120 Q165,100 180,88" stroke="#FDD5A0" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="72" cy="108" rx="10" ry="6" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="128" cy="108" rx="10" ry="6" fill="#FFB6C1" opacity="0.6"/>
</svg>
